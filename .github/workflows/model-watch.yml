name: 🔍 Model Discovery

on:
  schedule:
    # Once daily Mon-Fri (UTC). No weekend runs; keeps Level 1-2 base quiet.
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-fetch even if unchanged'
        type: boolean
        default: false

concurrency:
  group: model-watch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discover:
    name: Discover Free Models
    runs-on: ubuntu-latest
    outputs:
      catalog_id: ${{ steps.read.outputs.catalog_id }}
      total_models: ${{ steps.read.outputs.total_models }}
      has_changes: ${{ steps.read.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Discover models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_SITE_URL: ${{ vars.OPENROUTER_SITE_URL }}
          OPENROUTER_SITE_EMAIL: ${{ vars.OPENROUTER_SITE_EMAIL }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python watch_models.py --force
          else
            python watch_models.py
          fi

      - name: Read catalog output
        id: read
        run: |
          python - <<'EOF'
          import json, os
          with open('data/catalog/current_free_models.json') as f:
              data = json.load(f)
          catalog_id = data.get('catalog_id', '')
          total = data.get('total_models', 0)

          prev_ids = set()
          hist = 'data/catalog/free_models_history.jsonl'
          if os.path.exists(hist):
              with open(hist) as f:
                  lines = [l for l in f.read().splitlines() if l.strip()]
              for line in reversed(lines[:-1]):
                  entry = json.loads(line)
                  if entry.get('action') == 'snapshot' and entry.get('catalog_id') != catalog_id:
                      prev_ids = set(entry.get('model_ids', []))
                      break
          curr_ids = set(m['model_id'] for m in data.get('models', []))
          new_count = len(curr_ids - prev_ids)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'catalog_id={catalog_id}\n')
              f.write(f'total_models={total}\n')
              f.write(f'has_changes={str(new_count > 0).lower()}\n')
          print(f'catalog_id={catalog_id}  total={total}  new={new_count}')
          EOF

      - name: Commit catalog (always)
        run: |
          git config user.name "MOHAbdelkarim"
          git config user.email "mohaabdelkarim2@gmail.com"
          git add data/catalog/
          if git diff --cached --quiet; then
            echo "Nothing to commit. Catalog unchanged."
          else
            git commit -m "chore(catalog): snapshot $(date -u +%Y%m%dT%H%M%SZ) ${{ steps.read.outputs.total_models }} free models"
            git push
          fi

      - name: Job summary
        run: |
          echo "## 🔍 Model Discovery Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Catalog ID | \`${{ steps.read.outputs.catalog_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Total free models | **${{ steps.read.outputs.total_models }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Changes detected | ${{ steps.read.outputs.has_changes }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run at | $(date -u +"%Y-%m-%d %H:%M UTC") |" >> $GITHUB_STEP_SUMMARY
