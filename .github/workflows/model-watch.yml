name: Model Discovery

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-fetch even if unchanged'
        type: boolean
        default: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.discover.outputs.has_changes }}
      new_models: ${{ steps.discover.outputs.new_models }}
      catalog_id: ${{ steps.discover.outputs.catalog_id }}
      total_models: ${{ steps.discover.outputs.total_models }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Discover models
        id: discover
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_SITE_URL: ${{ vars.OPENROUTER_SITE_URL }}
          OPENROUTER_SITE_EMAIL: ${{ vars.OPENROUTER_SITE_EMAIL }}
        run: |
          python watch_models.py --force ${{ inputs.force == true && '--force' || '' }}
          echo "has_changes=$(python -c "import json; print(open('data/catalog/current_free_models.json').read() and 'true' if __import__('os').path.exists('data/catalog/current_free_models.json') else 'false')")" >> $GITHUB_OUTPUT

      - name: Read discovery result
        id: result
        run: |
          python -c "
          import json
          with open('data/catalog/current_free_models.json') as f:
              data = json.load(f)
          print(f'has_changes=true')
          print(f'catalog_id={data.get(\"catalog_id\", \"\")}')
          print(f'total_models={data.get(\"total_models\", 0)}')
          " >> $GITHUB_OUTPUT

      - name: Check for new models
        id: check_new
        run: |
          python -c "
          import json
          import sys
          
          # Read current catalog
          with open('data/catalog/current_free_models.json') as f:
              current = json.load(f)
          
          current_ids = set(m['model_id'] for m in current.get('models', []))
          
          # Try to find previous catalog
          import os
          prev_file = 'data/catalog/free_models_history.jsonl'
          prev_ids = set()
          
          if os.path.exists(prev_file):
              with open(prev_file) as f:
                  for line in f:
                      entry = json.loads(line.strip())
                      if entry.get('action') == 'snapshot' and entry.get('catalog_id') != current.get('catalog_id'):
                          prev_ids = set(entry.get('model_ids', []))
                          break
          
          new_ids = sorted(current_ids - prev_ids)
          
          print(f'new_models={json.dumps(new_ids)}')
          " >> $GITHUB_OUTPUT

      - name: Upload catalog snapshot
        if: steps.check_new.outputs.new_models != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-snapshot
          path: data/catalog/current_free_models.json
          retention-days: 7

      - name: Trigger benchmark for new models
        if: steps.check_new.outputs.new_models != '[]'
        run: |
          echo "New models detected: ${{ steps.check_new.outputs.new_models }}"
          echo "::set-output name=trigger_benchmark::true"
        id: trigger

  output:
    runs-on: ubuntu-latest
    needs: discover
    outputs:
      new_models: ${{ needs.discover.outputs.new_models }}
    steps:
      - name: Output new models
        run: |
          echo "New models: ${{ needs.discover.outputs.new_models }}"
