name: Model Discovery

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-fetch even if unchanged'
        type: boolean
        default: false

concurrency:
  group: model-watch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  discover:
    name: Discover Free Models
    runs-on: ubuntu-latest
    outputs:
      catalog_id: ${{ steps.catalog.outputs.catalog_id }}
      total_models: ${{ steps.catalog.outputs.total_models }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      new_models: ${{ steps.changes.outputs.new_models }}
      new_models_count: ${{ steps.changes.outputs.new_models_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Discover models
        id: discover
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_SITE_URL: ${{ vars.OPENROUTER_SITE_URL }}
          OPENROUTER_SITE_EMAIL: ${{ vars.OPENROUTER_SITE_EMAIL }}
        run: |
          python watch_models.py --force ${{ inputs.force == true && '--force' || '' }}

      - name: Read catalog
        id: catalog
        run: |
          python -c "
          import json
          with open('data/catalog/current_free_models.json') as f:
              data = json.load(f)
          print('catalog_id={}'.format(data.get('catalog_id', '')))
          print('total_models={}'.format(data.get('total_models', 0)))
          " >> $GITHUB_OUTPUT

      - name: Detect changes
        id: changes
        run: |
          python -c "
          import json
          import os

          with open('data/catalog/current_free_models.json') as f:
              current = json.load(f)

          current_ids = set(m['model_id'] for m in current.get('models', []))
          prev_ids = set()

          history_file = 'data/catalog/free_models_history.jsonl'
          if os.path.exists(history_file):
              with open(history_file) as f:
                  lines = f.readlines()
              for line in lines[-5:]:
                  entry = json.loads(line.strip())
                  if entry.get('action') == 'snapshot' and entry.get('catalog_id') != current.get('catalog_id'):
                      prev_ids = set(entry.get('model_ids', []))
                      break

          new_ids = sorted(current_ids - prev_ids)
          print('has_changes={}'.format(str(len(new_ids) > 0).lower()))
          print('new_models={}'.format(json.dumps(new_ids)))
          print('new_models_count={}'.format(len(new_ids)))
          " >> $GITHUB_OUTPUT

      - name: Commit catalog snapshot
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/catalog/
          git diff --cached --quiet || echo "No changes to commit"
          git diff --cached --quiet || git commit -m "chore: update free models catalog $(date -u +%Y-%m-%d)"
          git push

      - name: Trigger benchmark workflow
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "New free models detected: ${{ steps.changes.outputs.new_models_count }}"
          echo "Triggering benchmark workflow..."

  output:
    name: Output Status
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Model Discovery Summary"
          echo "- Catalog ID: ${{ needs.discover.outputs.catalog_id }}"
          echo "- Total free models: ${{ needs.discover.outputs.total_models }}"
          echo "- New models: ${{ needs.discover.outputs.new_models_count }}"
          if [ "${{ needs.discover.outputs.has_changes }}" == "true" ]; then
            echo "- Status: Changes detected, benchmark triggered"
          else
            echo "- Status: No changes"
          fi
