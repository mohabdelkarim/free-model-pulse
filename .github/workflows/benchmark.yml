name: Benchmark and Analysis

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:
    inputs:
      benchmark_reason:
        description: 'Reason'
        type: choice
        options: [manual, scheduled, new_model_detected]
        default: manual
      prompt_id:
        description: 'Prompt ID (optional)'
        type: string
        required: false
      force_catalog:
        description: 'Force re fetch catalog'
        type: boolean
        default: false
  repository_dispatch:
    types: [trigger-benchmark]

concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    name: Test then Benchmark then Analyze then Commit
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_SITE_URL: ${{ vars.OPENROUTER_SITE_URL }}
      OPENROUTER_SITE_EMAIL: ${{ vars.OPENROUTER_SITE_EMAIL }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        id: install
        run: pip install -r requirements.txt

      - name: Lint
        id: lint
        run: ruff check .

      - name: Run unit tests
        id: tests
        run: pytest tests/ -v

      - name: Refresh catalog
        id: catalog
        run: |
          if [ "${{ inputs.force_catalog }}" = "true" ]; then
            python watch_models.py --force
          else
            python watch_models.py || true
          fi

      - name: Run benchmark
        id: benchmark
        run: |
          REASON="${{ inputs.benchmark_reason || 'scheduled' }}"
          PROMPT_ARG=""
          if [ -n "${{ inputs.prompt_id }}" ]; then
            PROMPT_ARG="--prompt ${{ inputs.prompt_id }}"
          fi
          python benchmark.py --reason "$REASON" $PROMPT_ARG

      - name: Generate index and publish tables
        id: analyze
        run: python analyze.py --min-runs 1 --update-readme --write-pages

      - name: Commit data README and Pages
        id: commit
        run: |
          git config user.name "MOHAbdelkarim"
          git config user.email "mohaabdelkarim2@gmail.com"
          git add -f data/ README.md docs/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "ci(data): benchmark run $(date -u +%Y%m%dT%H%M%SZ)"
            git pull --rebase origin main
            git push
          fi

      - name: Job summary
        if: always()
        run: |
          mark() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "## Benchmark Run Summary"
            echo ""
            echo "| Step | Status |"
            echo "|---|---|"
            echo "| Checkout | $(mark ${{ steps.checkout.outcome }}) |"
            echo "| Install | $(mark ${{ steps.install.outcome }}) |"
            echo "| Lint | $(mark ${{ steps.lint.outcome }}) |"
            echo "| Tests | $(mark ${{ steps.tests.outcome }}) |"
            echo "| Catalog | $(mark ${{ steps.catalog.outcome }}) |"
            echo "| Benchmark | $(mark ${{ steps.benchmark.outcome }}) |"
            echo "| Analyze | $(mark ${{ steps.analyze.outcome }}) |"
            echo "| Commit | $(mark ${{ steps.commit.outcome }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/derived/model_index.csv ]; then
            TOTAL=$(tail -n +2 data/derived/model_index.csv | wc -l)
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Models in index:** $TOTAL" >> "$GITHUB_STEP_SUMMARY"
          fi
