name: Benchmark and Analysis

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:
    inputs:
      benchmark_reason:
        description: 'Reason'
        type: choice
        options: [manual, scheduled, new_model_detected]
        default: manual
      prompt_id:
        description: 'Prompt ID (optional)'
        type: string
        required: false
      force_catalog:
        description: 'Force re fetch catalog'
        type: boolean
        default: false
  repository_dispatch:
    types: [trigger-benchmark]

concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    name: Test then Benchmark then Analyze then Commit
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_SITE_URL: ${{ vars.OPENROUTER_SITE_URL }}
      OPENROUTER_SITE_EMAIL: ${{ vars.OPENROUTER_SITE_EMAIL }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        id: install
        run: pip install -r requirements.txt

      - name: Lint
        id: lint
        run: ruff check .

      - name: Run unit tests
        id: tests
        run: pytest tests/ -v

      - name: Refresh catalog
        id: catalog
        run: |
          if [ "${{ inputs.force_catalog }}" = "true" ]; then
            python watch_models.py --force
          else
            python watch_models.py
          fi

      - name: Run benchmark
        id: benchmark
        run: |
          REASON="${{ inputs.benchmark_reason || 'scheduled' }}"
          PROMPT_ARG=""
          if [ -n "${{ inputs.prompt_id }}" ]; then
            PROMPT_ARG="--prompt ${{ inputs.prompt_id }}"
          fi
          python benchmark.py --reason "$REASON" $PROMPT_ARG

      - name: Generate index and publish tables
        id: analyze
        run: >
          python analyze.py
          --min-runs 1
          --redact-raw-errors
          --update-readme
          --write-pages
          --leaderboard-min-runs 1

      - name: Commit data README and Pages
        id: commit
        run: |
          git config user.name "MOHAbdelkarim"
          git config user.email "mohaabdelkarim2@gmail.com"
          git add -f data/ README.md docs/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "ci(data): benchmark run $(date -u +%Y%m%dT%H%M%SZ)"
            git pull --rebase origin main
            git push
          fi

      - name: Job summary
        if: always()
        run: |
          mark() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "## Benchmark Run Summary"
            echo ""
            echo "| Step | Status |"
            echo "|---|---|"
            echo "| Checkout | $(mark ${{ steps.checkout.outcome }}) |"
            echo "| Install | $(mark ${{ steps.install.outcome }}) |"
            echo "| Lint | $(mark ${{ steps.lint.outcome }}) |"
            echo "| Tests | $(mark ${{ steps.tests.outcome }}) |"
            echo "| Catalog | $(mark ${{ steps.catalog.outcome }}) |"
            echo "| Benchmark | $(mark ${{ steps.benchmark.outcome }}) |"
            echo "| Analyze | $(mark ${{ steps.analyze.outcome }}) |"
            echo "| Commit | $(mark ${{ steps.commit.outcome }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/derived/model_index.csv ]; then
            TOTAL=$(tail -n +2 data/derived/model_index.csv | wc -l)
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Models in index:** $TOTAL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Slack digest on success
        if: success()
        env:
          SLACK_WEBHOOK_AI_PIPELINES: ${{ secrets.SLACK_WEBHOOK_AI_PIPELINES }}
        run: |
          if [ -z "$SLACK_WEBHOOK_AI_PIPELINES" ]; then exit 0; fi
          TOP=$(python -c "
          import csv, json
          from pathlib import Path
          cat = json.loads(Path('data/catalog/current_free_models.json').read_text(encoding='utf-8'))
          live = {m['model_id'] for m in cat.get('models', [])}
          rows = [r for r in csv.DictReader(open('data/derived/model_index.csv', encoding='utf-8')) if r.get('model_id') in live]
          def sk(r):
              try: sr = float(r['success_rate']) if r.get('success_rate') not in (None, '') else -1.0
              except Exception: sr = -1.0
              try: lat = float(r['latency_sec_median']) if r.get('latency_sec_median') not in (None, '') else 9999.0
              except Exception: lat = 9999.0
              return (-sr, lat)
          top = sorted(rows, key=sk)[:3]
          print('\\n'.join(f\"• {r.get('display_name','?')}: sr={r.get('success_rate','?')} p50={r.get('latency_sec_median','?')}s\" for r in top) or 'No live models')
          " 2>/dev/null || echo "Benchmark completed")
          python slack_notify.py --digest \
            --title "free-model-pulse" \
            --text "Top latency (p50):\n${TOP}" \
            --webhook-env SLACK_WEBHOOK_AI_PIPELINES

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
          webhook-type: incoming-webhook
          payload: |
            text: "CI failed: ${{ github.repository }} / ${{ github.workflow }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*${{ github.repository }}* — `${{ github.workflow }}` failed\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
